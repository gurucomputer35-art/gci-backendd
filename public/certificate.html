<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate · Guru Computer Institute</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Hind:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--ink:#14254a;--saf:#f39232;--grn:#1d8a5b;--mu:#56627a;--paper:#fffdf8;--fd:"Bricolage Grotesque","Hind",system-ui,sans-serif;--fb:"Hind",system-ui,sans-serif;--fs:"Tiro Devanagari Hindi",Georgia,serif;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:#e9edf4;color:var(--ink);font-family:var(--fb);padding:20px 16px 40px}
.bar{max-width:1000px;margin:0 auto 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar a,.bar button{font:inherit;font-weight:600;border-radius:9px;padding:9px 16px;border:0;cursor:pointer;text-decoration:none}
.bar button{background:var(--ink);color:#fff}.bar a{color:var(--ink);background:#fff}
.wrap{max-width:1000px;margin:0 auto;overflow-x:auto}
.cert{position:relative;width:100%;min-width:720px;aspect-ratio:297/210;background:var(--paper);padding:3.2%;box-shadow:0 20px 50px -25px rgba(20,37,74,.5)}
.frame{position:absolute;inset:2.2%;border:3px solid var(--ink);outline:1.5px solid var(--saf);outline-offset:-9px}
.in{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2.5% 6%}
.top{display:flex;align-items:center;gap:14px}.top img{height:64px}.top h1{font-family:var(--fd);font-weight:800;font-size:2rem;margin:0;letter-spacing:-.02em}
.addr{color:var(--mu);font-size:.85rem;margin:2px 0 0}
.title{font-family:var(--fs);font-size:2.3rem;margin:3.5% 0 0;color:var(--ink);letter-spacing:.02em}
.rule{width:120px;height:3px;background:var(--saf);margin:8px auto 0}
.body{font-size:1.15rem;line-height:1.9;max-width:760px;margin:3% 0 0}
.name{font-family:var(--fs);font-size:2.1rem;line-height:1.3;display:block;margin:6px 0 2px;border-bottom:1.5px solid #d8d2c4;padding:0 30px}
.course{font-weight:600;font-family:var(--fd);font-size:1.3rem}
.foot{margin-top:auto;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:20px;font-size:.88rem}
.meta{text-align:left;line-height:1.7}.meta b{font-family:var(--fd)}
.qr{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mu);font-size:.72rem}.qr #q{background:#fff;padding:4px}.qr #q img,.qr #q canvas{width:86px!important;height:86px!important}
.sign{text-align:right}.sign span{display:inline-block;border-top:1.5px solid var(--ink);padding-top:4px;min-width:170px;text-align:center}
.seal{position:absolute;right:7%;top:9%;width:84px;height:84px;border-radius:50%;background:var(--saf);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:800;font-size:1rem;box-shadow:0 0 0 5px var(--paper),0 0 0 7px var(--saf)}
.note{max-width:1000px;margin:14px auto 0;color:var(--mu);font-size:.9rem}
.state{max-width:560px;margin:10vh auto;background:#fff;border-radius:12px;padding:24px;text-align:center}
@page{size:A4 landscape;margin:0}
@media print{body{background:#fff;padding:0}.bar,.note{display:none}.wrap{max-width:none;overflow:visible}.cert{min-width:0;width:297mm;height:210mm;aspect-ratio:auto;box-shadow:none}}
</style>
</head>
<body>
<div id="out"><div class="state">Loading certificate…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fd(v){if(!v)return "-";var d=new Date(v);return isNaN(d)?"-":d.toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric",timeZone:"Asia/Kolkata"})}
var id=(new URLSearchParams(location.search).get("id")||"").trim().toUpperCase(),out=document.getElementById("out");
if(!id)out.innerHTML="<div class='state'>No certificate number given. <a href='/#verify'>Verify a certificate</a></div>";
else fetch("/api/certificate?id="+encodeURIComponent(id)).then(function(r){return r.json()}).then(function(d){
 if(!d.ok||!d.found){out.innerHTML="<div class='state'><h2>Certificate not found</h2><p>No certificate with number <b>"+esc(id)+"</b>. Check the number, or call +91 93898 24310.</p><p><a href='/'>Go to website</a></p></div>";return}
 var c=d.certificate,verify=location.origin+"/#verify";
 document.title=c.name+" · "+c.certificateId;
 out.innerHTML="<div class='bar'><a href='/'>← Website</a><span>"+(c.pdf?"<a target='_blank' rel='noopener' href='"+esc(c.pdf)+"'>Original PDF</a> ":"")+"<button onclick='print()'>Print / Save as PDF</button></span></div>"
 +"<div class='wrap'><div class='cert'><div class='frame'></div><div class='seal'>GCI</div><div class='in'>"
 +"<div class='top'><img src='/logo.png' alt=''><div><h1>Guru Computer Institute</h1><p class='addr'>Gurudwara Road, Opposite Diwakar Hospital, Raja Ka Tajpur, Bijnor (U.P.)</p></div></div>"
 +"<p class='title'>Certificate of Completion</p><div class='rule'></div>"
 +"<p class='body'>This is to certify that<span class='name'>"+esc(c.name)+"</span>son / daughter of <b>"+esc(c.fatherName)+"</b>"+(c.motherName?" and <b>"+esc(c.motherName)+"</b>":"")+", has successfully completed the course<br><span class='course'>"+esc(c.course)+"</span>"+(c.duration?" ("+esc(c.duration)+")":"")+(c.grade?" with grade <b>"+esc(c.grade)+"</b>":"")+"<br>at "+esc(c.centre)+".</p>"
 +"<div class='foot'><div class='meta'>Certificate no. <b>"+esc(c.certificateId)+"</b><br>Enrollment ID <b>"+esc(c.studentId)+"</b>"+(c.rollNo?" · Roll no. <b>"+esc(c.rollNo)+"</b>":"")+"<br>Date of issue <b>"+fd(c.issueDate)+"</b></div>"
 +"<div class='qr'><div id='q'></div>Scan to verify</div><div class='sign'><span>Director</span></div></div></div></div></div>"
 +"<p class='note'>Anyone can check this certificate at "+esc(verify)+" with number "+esc(c.certificateId)+".</p>";
 try{new QRCode(document.getElementById("q"),{text:location.origin+"/certificate.html?id="+encodeURIComponent(c.certificateId),width:172,height:172,correctLevel:QRCode.CorrectLevel.M})}catch(e){document.querySelector(".qr").style.visibility="hidden"}
}).catch(function(){out.innerHTML="<div class='state'>Could not load the certificate. Check your internet and try again.</div>"});
</script>
</body>
</html>
